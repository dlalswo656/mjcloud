spring.application.name=mjcloud

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/mjcloud?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=0000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 파일 업로드 (음악 파일)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=src/main/resources/static/uploads

# JWT
jwt.secret=mjcloud-secret-key-must-be-at-least-256-bits-long-for-security
jwt.expiration=86400000

# CORS (React 포트)
server.port=8080
